[project]
name = "rag1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karamthot Anil Naik", email = "kanilnaik2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.0",
    "jsonpatch>=1.33",
    "langchain>=1.3.18",
    "langchain-core>=1.6.1",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.62.0",
    "unstructured>=0.27.5",
]

[project.scripts]
rag1 = "rag1:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
